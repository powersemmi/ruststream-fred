name: CI

on:
  push:
    branches: [main]
  # No base filter: a pull request stacked on another one has a branch for its base, and a filter
  # naming `main` leaves it with no checks at all - which reads as a conflicting branch rather
  # than as a workflow that declined to run.
  #
  # A draft runs nothing until it is marked ready for review, which is what `ready_for_review` is
  # here for: an agent opens its work as a draft, and the maintainer decides when CI spends its
  # time on it. It has to be listed because naming any type at all replaces the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    # Every other job needs this one, so the draft gate lives here: a skipped gate skips them all.
    if: >-
      github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      templates: ${{ steps.filter.outputs.templates }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              # the stand the broker-integration job starts
              - 'docker-compose.test.yml'
              - '.github/workflows/ci.yml'
            templates:
              - 'templates/**'
              - 'crates/ruststream-fred/src/**'
              - 'crates/ruststream-fred/Cargo.toml'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'properdocs.yml'
              - 'overrides/**'
              - 'crates/ruststream-fred/examples/**'
              - 'scripts/lint_doc_fences.py'
              - 'scripts/check_doc_i18n.py'
              - 'scripts/doc_glossary.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint and checks
    needs: changes
    # One runner for every check outside the build job: the dependency graph, spelling, the
    # workflows, formatting, lints, the scaffolds, each feature alone and minimal versions. Not
    # path-gated as a whole: advisories arrive over time, not only with manifest changes, so
    # `cargo deny` runs on every pull request, and so do the spelling and workflow scans, which
    # read the whole tree. The Rust steps run when the Rust sources changed, the scaffolds when
    # they or the crate did. Each check runs whatever the one before it did, so a red formatting
    # step hides no later verdict. Minimal versions rewrites the lock file and the manifests for
    # good, so it comes last.
    runs-on: ubuntu-latest
    # The repository is checked out one level down: the scaffold check patches the rendered
    # projects at a sibling checkout of the core, and the two sit side by side in the workspace.
    defaults:
      run:
        working-directory: ruststream-fred
    env:
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
      TEMPLATES_CHANGED: ${{ needs.changes.outputs.templates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.13
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate versions, and
      # registry sources, per the checked-in deny.toml.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        if: "!cancelled()"
        uses: astral-sh/setup-uv@v7

      - name: codespell
        if: "!cancelled()"
        run: uvx codespell

      - name: zizmor
        if: "!cancelled()"
        run: uvx zizmor .github/workflows

      # Installed beside stable, which `rust-toolchain.toml` keeps the default: the floor for
      # minimal versions and a nightly for its resolver. The floor is spelled out here and in the
      # build job; keep it in step with `rust-version` in the workspace manifest.
      - name: Install the extra toolchains
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: rustup toolchain install --profile minimal 1.88 nightly

      - name: Cache cargo
        if: >-
          !cancelled()
          && (env.RUST_CHANGED == 'true' || env.TEMPLATES_CHANGED == 'true')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      - name: Install cargo-hack
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        uses: taiki-e/install-action@v2.87.13
        with:
          tool: cargo-hack

      - name: Install cargo-generate
        if: "!cancelled() && env.TEMPLATES_CHANGED == 'true'"
        uses: taiki-e/install-action@v2.87.13
        with:
          tool: cargo-generate

      - name: cargo fmt
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo fmt --all -- --check

      # The benchmark package is left out of the all-features lints on purpose: it is built with
      # the feature set a service ships, and the framework's harness feature is a compile error in
      # it. Its own lint follows, so it stays linted and stays compiled; `just bench` runs it.
      - name: cargo clippy
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: |
          cargo clippy --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features -- -D warnings
          cargo clippy -p ruststream-fred-bench --all-targets -- -D warnings

      # The rendered scaffolds pin `ruststream` (and depend on this crate), so the cross-repo
      # sibling checkout must be present to patch them at the local checkouts.
      - uses: actions/checkout@v7
        if: "!cancelled() && env.TEMPLATES_CHANGED == 'true'"
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      # The template-contract drift check: render each Redis scaffold and compile it, so an API
      # change that breaks a template fails here, not a user's first `cargo build`. Compile-only,
      # with no live Redis. The rendered projects pin `ruststream` / `ruststream-fred` by version,
      # so patch both at the local checkouts to test the code in this PR rather than the last
      # release. No --locked: a fresh scaffold has no lock file, which is what a user starts from.
      - name: Render and check the Redis templates
        if: "!cancelled() && env.TEMPLATES_CHANGED == 'true'"
        run: |
          for tpl in redis-stream redis-pubsub redis-list; do
            dest="$RUNNER_TEMP/$tpl"
            mkdir -p "$dest"
            cargo generate --path "templates/$tpl" \
              --name smoke --destination "$dest" --vcs none
            # The scaffold manifest is checked in as `Cargo.toml.liquid` so that cargo's git-source
            # package discovery never parses its placeholder name. Assert that cargo-generate did
            # drop the suffix, otherwise the append below would quietly write a manifest of its own.
            test -f "$dest/smoke/Cargo.toml"
            {
              echo ""
              echo "[patch.crates-io]"
              echo "ruststream = { path = \"$GITHUB_WORKSPACE/ruststream\" }"
              echo "ruststream-fred = { path = \"$GITHUB_WORKSPACE/ruststream-fred/crates/ruststream-fred\" }"
            } >> "$dest/smoke/Cargo.toml"
            cargo check --manifest-path "$dest/smoke/Cargo.toml"
          done

      # Every feature here is additive and each one gates real API (the TLS backends, the
      # sentinel and dynamic-credential surfaces, the test broker), so a missing `cfg` on an
      # item or its import only shows up when that feature is the only one on.
      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library. It
      # also rewrites the manifests while it runs, so it comes after every step that needs the
      # tree as checked in.
      - name: cargo hack check (each feature)
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo hack check --workspace --each-feature --no-dev-deps

      # Minimal versions is one chain: each step runs only when the one before it succeeded, since
      # a step on a graph that failed to resolve checks nothing.
      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        id: minimal-resolve
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo +nightly update -Z minimal-versions

      # Every pin here is a bound a third-party manifest declares more loosely than the code behind
      # it actually needs, so minimal resolution picks a version that does not compile. Each was
      # established by bisecting the failure, and each names the crate at fault so it can be dropped
      # when that crate tightens its own floor. A bound this repo declares itself is raised in the
      # manifest instead of pinned here. Order matters for the openssl pair only.
      - name: Pin dependencies whose declared bounds are too loose
        id: minimal-pin
        if: "!cancelled() && steps.minimal-resolve.outcome == 'success'"
        run: |
          # The serde floor is set by what the graph's own manifests demand, not by serde itself:
          # serde_norway (the YAML writer behind the core's asyncapi feature) requires 1.0.203, and
          # serde_json requires 1.0.194 from its lowest release that is not yanked, 1.0.127.
          # rmp-serde's own floor, 1.0.136, sits below both.
          cargo update -p serde --precise 1.0.203
          # tracing-attributes declares `syn = "1"` yet calls `LitInt::base10_parse`, added in
          # syn 1.0.4. serde_derive is on syn 2 at the pin above, so nothing else lifts syn 1.x.
          cargo update -p syn@1.0.0 --precise 1.0.4
          # fred declares `tokio-stream = "0.1"` but uses `tokio_stream::wrappers`, added in 0.1.1.
          cargo update -p tokio-stream --precise 0.1.1
          # native-tls' floor selects an openssl that predates OpenSSL 3.x and binds FFI symbols
          # since removed, so it cannot build against the runner's headers. 0.10.38 is the first
          # OpenSSL-3-capable release.
          cargo update -p openssl --precise 0.10.38
          # Must follow the openssl pin, which drags openssl-sys up to 0.9.117 on its own. Earlier
          # openssl-sys build scripts reject a system OpenSSL 3.x outright.
          cargo update -p openssl-sys --precise 0.9.72

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        id: minimal-test
        if: "!cancelled() && steps.minimal-pin.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features
          cargo check --locked -p ruststream-fred-bench --all-targets
          cargo test --locked --workspace --all-features --no-fail-fast

  rust:
    name: Build and test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # Stable first, then the early warning and the floor on the same runner, and those two only
    # once stable passed as a whole: a break stable already reports is not worth two more
    # builds. Releases between the floor and stable add nothing: what fails on a later one fails
    # on the floor too. Stable is the default through `rust-toolchain.toml`; the later steps
    # name theirs through RUSTUP_TOOLCHAIN, which outranks the file.
    runs-on: ubuntu-latest
    # The repository is checked out one level down: the scaffold check patches the rendered
    # projects at a sibling checkout of the core, and the two sit side by side in the workspace.
    defaults:
      run:
        working-directory: ruststream-fred
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install beta and the floor
        run: |
          rustup toolchain install --profile minimal --component clippy beta
          rustup toolchain install --profile minimal 1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      # The benchmark package is left out of every all-features check on purpose: it is built
      # with the feature set a service ships, and the framework's harness feature is a compile
      # error in it. Its own check follows, so it stays compiled.
      - name: cargo check (all features)
        run: |
          cargo check --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features
          cargo check -p ruststream-fred-bench --all-targets

      # The handler-stub suite: the live tests skip themselves without the Redis addresses, and
      # the broker-integration job runs them against every Redis topology.
      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features --no-fail-fast

      # The gate the later toolchains wait on: it succeeds only when every stable step did.
      - name: Stable passed
        id: stable
        run: echo "stable passed"

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks before
      # it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: beta
        run: |
          cargo clippy --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features -- -D warnings
          cargo clippy -p ruststream-fred-bench --all-targets -- -D warnings

      - name: cargo check (no default features, beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features, beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: |
          cargo check --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features
          cargo check -p ruststream-fred-bench --all-targets

      - name: cargo test (beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: cargo test --workspace --all-features --no-fail-fast

      - name: cargo check (no default features, 1.88)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features, 1.88)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --workspace --exclude ruststream-fred-bench --all-targets \
            --all-features
          cargo check -p ruststream-fred-bench --all-targets

      - name: cargo test (1.88)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: cargo test --workspace --all-features --no-fail-fast

  broker-integration:
    name: "Broker integration (Redis: standalone, 8.4, cluster, sentinel)"
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      # The compose file brings up every topology (standalone on 7.x and on 8.4, a 6-node cluster,
      # and a sentinel set) on host networking, so every node announces and reaches its peers on
      # 127.0.0.1 - the same addresses the test process uses. `--wait` blocks until every service is
      # healthy and the one-shot cluster-init has formed the cluster.
      - name: Start Redis topologies
        working-directory: ruststream-fred
        run: docker compose -f docker-compose.test.yml up -d --wait

      # RUSTSTREAM_REQUIRE_LIVE is this job's contract with the suites: the servers are up, so a
      # test that skips is a defect rather than a convenience. Without it a gated test returns
      # before its first assertion and reports ok, which reads exactly like a run that did the
      # work - and this job gates on four addresses, so it has four ways to go quietly green.
      # The claiming suite is a second binary because it runs against a second server: the 8.4
      # standalone for the mode itself, and the 7.x one for the startup refusal.
      - name: Run Redis integration tests (standalone + 8.4 + cluster + sentinel)
        working-directory: ruststream-fred
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          REDIS_84_TEST_URL: redis://127.0.0.1:6386
          REDIS_AUTH_TEST_URL: redis://127.0.0.1:6385
          REDIS_CLUSTER_TEST_URL: 127.0.0.1:7000
          REDIS_SENTINEL_TEST_URL: 127.0.0.1:26379
          RUSTSTREAM_REQUIRE_LIVE: "1"
        run: |
          cargo test -p ruststream-fred --test integration_fred -- --test-threads=1
          cargo test -p ruststream-fred --test integration_claiming -- --test-threads=1
          cargo test -p ruststream-fred --test integration_pubsub -- --test-threads=1

      - name: Run Redis conformance suite
        working-directory: ruststream-fred
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          RUSTSTREAM_REQUIRE_LIVE: "1"
        run: cargo test -p ruststream-fred --features testing --test conformance_fred -- --test-threads=1

      - name: Stop Redis topologies
        if: always()
        working-directory: ruststream-fred
        run: docker compose -f docker-compose.test.yml down -v

  docs:
    name: Build site
    needs: [changes, lint]
    # After the lint job, and only when it passed: a site built from code that fails its own
    # gates is not worth the runner.
    if: >-
      needs.changes.outputs.docs == 'true'
      && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Lint doc code fences
        run: python3 scripts/lint_doc_fences.py

      - name: Check translated pages against their originals
        run: python3 scripts/check_doc_i18n.py

      - name: Build site (strict)
        run: properdocs build --strict

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: lint
    # After the lint job, and only when it passed. None of the three languages needs a build:
    # Rust and Python are extracted from source, and `actions` reads the workflows.
    if: needs.lint.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  result:
    name: CI result
    # The one check the `main` ruleset requires: it speaks for every job above, so a job that
    # comes, goes or is renamed never touches the ruleset. Skipped counts as passed, anything
    # else fails. A draft skips it with the rest, and the run that marking it ready starts
    # reports again.
    needs:
      - changes
      - lint
      - rust
      - broker-integration
      - docs
      - codeql
    if: >-
      always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
