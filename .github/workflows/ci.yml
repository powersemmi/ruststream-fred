name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. Keep the floor in step with
        # `rust-version` in the workspace manifest.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-fred
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-fred
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        working-directory: ruststream-fred
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        working-directory: ruststream-fred
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        working-directory: ruststream-fred
        run: cargo check --workspace --all-targets --all-features

      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        working-directory: ruststream-fred
        run: cargo test --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-fred
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-hack

      # Every feature here is additive and each one gates real API (the TLS backends, the
      # sentinel and dynamic-credential surfaces, the test broker), so a missing `cfg` on an
      # item or its import only shows up when that feature is the only one on.
      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      - name: cargo hack check (each feature)
        working-directory: ruststream-fred
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with
      # `rust-version` in the workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        working-directory: ruststream-fred
        run: cargo +nightly update -Z minimal-versions

      # Every pin here is a bound some manifest declares more loosely than the code it ships
      # actually needs, so minimal resolution picks a version that does not compile. Each was
      # established by bisecting the failure, and each should be dropped when the crate at fault
      # tightens its own floor. Order matters only for the openssl pair, noted below.
      - name: Pin dependencies whose declared bounds are too loose
        working-directory: ruststream-fred
        run: |
          # serde <= 1.0.102 declares `serde_derive = "1.0"` rather than an exact pin, so minimal
          # resolution pairs it with serde_derive 1.0.0 (built on syn 0.11), which cannot parse a
          # modern struct. 1.0.103 is the first serde that exact-pins its own derive.
          cargo update -p serde --precise 1.0.103
          # async-trait 0.1.0 declares `quote = "0.6"` but expands `quote_spanned!`. 0.1.77 is the
          # first release whose own floors (proc-macro2, quote, syn 2) are tight enough to build.
          cargo update -p async-trait --precise 0.1.77
          # The `warn!(target: .., ?field, "msg")` macro arm does not exist before tracing 0.1.24,
          # so a `Duration` field is passed by value and fails the `Value` bound.
          cargo update -p tracing --precise 0.1.24
          # tracing 0.1.24 declares `tracing-core = "0.1.17"`, which lacks the `Value` impl for
          # `Option<T>` that an `#[instrument(fields(..))]` on an optional target needs.
          cargo update -p tracing-core --precise 0.1.23
          # tracing-core declares `lazy_static = "1"` but invokes it by path; 1.0.0 exports the
          # macro without `local_inner_macros`, so its helper is out of scope at the call site.
          cargo update -p lazy_static --precise 1.1.0
          # fred declares `tokio-stream = "0.1"` but uses `tokio_stream::wrappers`, added in 0.1.1.
          cargo update -p tokio-stream --precise 0.1.1
          # native-tls 0.2.3 pulls openssl 0.10.15, which predates OpenSSL 3.x and fails against
          # the runner's headers. 0.10.38 is the first release with OpenSSL 3.0 support.
          cargo update -p openssl --precise 0.10.38
          # Must follow the openssl pin: that pin re-resolves the `ffi` dependency to the newest
          # 0.9.x, whose callback signatures no longer match 0.10.38.
          cargo update -p openssl-sys --precise 0.9.72

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        working-directory: ruststream-fred
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: "Broker integration (Redis: standalone, cluster, sentinel)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      # The compose file brings up all three topologies (standalone, a 6-node cluster, and a
      # sentinel set) on host networking, so every node announces and reaches its peers on
      # 127.0.0.1 - the same addresses the test process uses. `--wait` blocks until every service is
      # healthy and the one-shot cluster-init has formed the cluster.
      - name: Start Redis topologies
        working-directory: ruststream-fred
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run Redis integration tests (standalone + cluster + sentinel)
        working-directory: ruststream-fred
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          REDIS_AUTH_TEST_URL: redis://127.0.0.1:6385
          REDIS_CLUSTER_TEST_URL: 127.0.0.1:7000
          REDIS_SENTINEL_TEST_URL: 127.0.0.1:26379
        run: cargo test -p ruststream-fred --test integration_fred -- --test-threads=1

      - name: Run Redis conformance suite
        working-directory: ruststream-fred
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
        run: cargo test -p ruststream-fred --features testing --test conformance_fred -- --test-threads=1

      - name: Stop Redis topologies
        if: always()
        working-directory: ruststream-fred
        run: docker compose -f docker-compose.test.yml down -v

  templates:
    name: Templates (render + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      # The rendered scaffolds pin `ruststream` (and depend on this crate), so the cross-repo
      # sibling checkout must be present to patch them at the local checkouts.
      - uses: actions/checkout@v7
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-fred

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-generate

      # The template-contract drift check: render each Redis scaffold and compile it, so an API
      # change that breaks a template fails here, not a user's first `cargo build`. Compile-only,
      # with no live Redis. The rendered projects pin `ruststream` / `ruststream-fred` by version,
      # so patch both at the local checkouts to test the code in this PR rather than the last
      # release. No --locked: a fresh scaffold has no lock file, which is what a user starts from.
      - name: Render and check the Redis templates
        run: |
          for tpl in redis-stream redis-pubsub redis-list; do
            dest="$RUNNER_TEMP/$tpl"
            mkdir -p "$dest"
            cargo generate --path "ruststream-fred/templates/$tpl" \
              --name smoke --destination "$dest" --vcs none
            {
              echo ""
              echo "[patch.crates-io]"
              echo "ruststream = { path = \"$GITHUB_WORKSPACE/ruststream\" }"
              echo "ruststream-fred = { path = \"$GITHUB_WORKSPACE/ruststream-fred/crates/ruststream-fred\" }"
            } >> "$dest/smoke/Cargo.toml"
            cargo check --manifest-path "$dest/smoke/Cargo.toml"
          done

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ruststream-fred

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        working-directory: ruststream-fred
        run: cargo deny check

      # No cache: there is no uv.lock anymore (uvx resolves the tools on the fly).
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        working-directory: ruststream-fred
        run: uvx codespell

      - name: zizmor
        working-directory: ruststream-fred
        run: uvx zizmor .github/workflows
