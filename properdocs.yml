site_name: ruststream-fred
site_description: The Redis broker for RustStream - Redis Streams consumer groups, an in-process test broker, and the lazy-startup broker contract.
site_url: https://powersemmi.github.io/ruststream-fred/
repo_url: https://github.com/powersemmi/ruststream-fred
repo_name: powersemmi/ruststream-fred
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Renders :material-xxx: / :fontawesome-xxx: shortcodes (used on the home page grid) as inline
  # SVG icons. Without it those shortcodes show up as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks/snippet_titles.py
  - docs/hooks/i18n_banner.py

plugins:
  - search
  # The transport guides now live in the crate's own reference, where the code they describe
  # is. Each page that was here keeps its URL and lands on the section that took it over.
  - redirects:
      redirect_maps:
        streams.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#streams
        ru/streams.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#streams
        zh/streams.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#streams
        lists.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#lists
        ru/lists.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#lists
        zh/lists.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#lists
        pubsub.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#pubsub
        ru/pubsub.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#pubsub
        zh/pubsub.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#pubsub
        dead-letter.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#capping-the-retries
        ru/dead-letter.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#capping-the-retries
        zh/dead-letter.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#capping-the-retries
        auth-tls.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#operations
        ru/auth-tls.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#operations
        zh/auth-tls.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#operations
        transactions.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#transactions
        ru/transactions.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#transactions
        zh/transactions.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#transactions
        asyncapi.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#the-generated-document
        ru/asyncapi.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#the-generated-document
        zh/asyncapi.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/index.html#the-generated-document
        testing.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/testing/index.html
        ru/testing.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/testing/index.html
        zh/testing.md: https://docs.rs/ruststream-fred/latest/ruststream_fred/testing/index.html
  # Versioned docs are published with `mike` (see the Docs workflow and the version switcher).
  # Each translation is a tree of its own under `docs/<locale>/`, mirroring the English paths.
  # English stays at the docs root: a file outside a locale folder is the default language.
  # The alternative, a `<page>.<locale>.md` suffix beside each original, put a page and its
  # translations in one listing, but the suffix form multiplies every directory by the number
  # of languages.
  #
  # English is normative; a page with no translation yet falls back to the English text inside
  # the localized site rather than disappearing from it, which is what lets translations land
  # page by page. Every page is translated today, so the fallback covers only a page added
  # to the English tree before its translations.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Russian
          build: true
          nav_translations:
            Home: Главная
            Benchmarks: Бенчмарки
            RustStream docs: Документация RustStream
            API reference: Справочник API
        - locale: zh
          name: Chinese
          build: true
          nav_translations:
            Home: 首页
            Benchmarks: 基准测试
            RustStream docs: RustStream 文档
            API reference: API 参考

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/powersemmi/ruststream-fred

nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
  - RustStream docs: https://powersemmi.github.io/ruststream/
  - API reference: https://docs.rs/ruststream-fred
