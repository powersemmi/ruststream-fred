# cargo-generate manifest for the Redis list (work-queue) RustStream starter.
#
# Render it with:
#   cargo generate --git https://github.com/powersemmi/ruststream-fred templates/redis-list --name my-service
#
# `{{project-name}}` (the --name value) is a cargo-generate built-in; no placeholders need declaring.
#
# The manifest is `Cargo.toml.liquid`: cargo-generate drops the suffix after rendering, and cargo
# never parses a placeholder package name when it walks this repository as a git source.
[template]
description = "A Redis list (work-queue) RustStream starter service"
