[package]
name = "ruststream-fred"
description = "Redis / Valkey broker implementation (Streams) for the RustStream messaging framework, backed by fred."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["redis", "streams", "messaging", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The in-process mode `TestApp` runs an app on: an in-process Redis under `fred`'s own mock layer.
# The conformance harness is broker-author tooling and stays a dev-dependency of this crate.
testing = ["ruststream/testing", "fred/mocks"]

# The document-plane hooks: what this crate's descriptors and publish policies add to the
# generated AsyncAPI document. Forwards the core feature that defines them.
asyncapi = ["ruststream/asyncapi"]

# TLS, mapped onto fred's TLS backends. The rustls and native-tls backends are additive in fred
# (not mutually exclusive); `tls-rustls` uses the aws-lc-rs crypto provider, `tls-rustls-ring` the
# ring provider. The TLS surface is gated on any of these being on.
tls-rustls = ["fred/enable-rustls"]
tls-rustls-ring = ["fred/enable-rustls-ring"]
tls-native-tls = ["fred/enable-native-tls"]

# Distinct credentials for authenticating to the sentinels (vs the data nodes).
sentinel-auth = ["fred/sentinel-auth"]

# Dynamic/rotating credentials (IAM-style auth) via a CredentialProvider callback.
credential-provider = ["fred/credential-provider"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# The conformance harness drives the testing-feature broker; macros + json power the runnable
# fred_* examples (the docs site embeds their snippets), and serde decodes their message types.
# `cbor` and `msgpack` are here for the envelope tests only: a service picks the envelope codec, so
# the text-or-bytes field has to be proven against every codec the framework ships, not only JSON.
ruststream = { workspace = true, features = [
    "asyncapi",
    "conformance",
    "testing",
    "macros",
    "json",
    "cbor",
    "msgpack",
] }
serde = { version = "1", features = ["derive"] }
# The document tests read the generated AsyncAPI back as JSON to assert on the crate's bindings.
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# Only the credential-provider unit test implements fred's async CredentialProvider trait.
# 0.1.77 is the real floor, not 0.1: earlier releases declare `quote = "0.6"` yet do not compile
# against quote 0.6.0, so the minimal-versions job resolved a graph that could not build.
async-trait = "0.1.77"

[dependencies]
ruststream = { workspace = true, default-features = false }
# `i-scripts` is the Lua and function surface a pipelined handler queues through; `i-client` is
# `CLIENT UNBLOCK`, which a dropped subscription interrupts its blocked read with.
fred = { workspace = true, features = ["i-scripts", "i-client"] }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

