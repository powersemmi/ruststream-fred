# Redis's own terms. A concept that belongs to the broker is named with the word Redis's
# documentation and its readers use in that language, not with a framework word that happens to
# be near: a Redis stream is a stream, a consumer group is a consumer group. Where a framework
# concept meets one on the same page, the broker keeps its word and the framework's concept is
# qualified ("партиции воркеров"), never renamed.

[[term]]
en = "stream"
en_match = "streams?"
ru = "поток"
ru_match = "поток"
zh = "流"

[[term]]
en = "consumer group"
en_match = "consumer[- ]groups?"
ru = "группа потребителей"
ru_match = "групп\\w* потребител"
zh = "消费者组"

[[term]]
en = "consumer"
en_match = "consumers?"
ru = "потребитель"
ru_match = "потребител"
zh = "消费者"

[[term]]
